# Aggiorna ogni giorno il CAPE dell'S&P 500 (data/cape.json) letto dalla barra "Dati live".
# Richiede: Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions".
name: Aggiorna CAPE

on:
  schedule:
    - cron: '17 22 * * 1-5'   # dal lunedi al venerdi alle 22:17 UTC, dopo la chiusura di Wall Street
  workflow_dispatch:           # avvio manuale dalla scheda Actions

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leggi il CAPE corrente
        run: python .github/scripts/aggiorna_cape.py
      - name: Salva se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/cape.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nessuna modifica"; else git commit -m "Aggiorna CAPE S&P 500" && git push; fi
